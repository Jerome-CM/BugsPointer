name: Deploy Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_PATH: /home/${{ secrets.VPS_USER }}/apps/bugspointer/staging
      SERVICE_NAME: bugspointer-staging
      SSH_OPTS: -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes
      JAR_PATH: target/bugspointer-0.0.1-SNAPSHOT.jar

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Package jar
        run: ./mvnw -DskipTests package

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Validate SSH connectivity
        run: |
          ssh -v ${{ env.SSH_OPTS }} -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo SSH connectivity OK"

      - name: Ensure release directory exists
        run: |
          ssh ${{ env.SSH_OPTS }} -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p '${{ env.DEPLOY_PATH }}'"

      - name: Upload jar
        run: |
          scp ${{ env.SSH_OPTS }} -i ~/.ssh/id_ed25519 \
            "${{ env.JAR_PATH }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/bugspointer.jar"

      - name: Restart staging service
        run: |
          ssh ${{ env.SSH_OPTS }} -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo -n /usr/bin/systemctl restart '${{ env.SERVICE_NAME }}' && /usr/bin/systemctl --no-pager --full status '${{ env.SERVICE_NAME }}'"

      - name: Store staging release metadata
        run: |
          LOCAL_SHA="$(sha256sum "${{ env.JAR_PATH }}" | awk '{print $1}')"
          ssh ${{ env.SSH_OPTS }} -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "printf '%s\n' '${{ github.sha }}' > '${{ env.DEPLOY_PATH }}/bugspointer.commit_sha' && \
             printf '%s\n' '$LOCAL_SHA' > '${{ env.DEPLOY_PATH }}/bugspointer.jar.sha256'"
