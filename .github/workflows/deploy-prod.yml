name: Deploy Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      STAGING_PATH: /home/${{ secrets.VPS_USER }}/apps/bugspointer/staging
      DEPLOY_PATH: /home/${{ secrets.VPS_USER }}/apps/bugspointer/prod
      SERVICE_NAME: bugspointer
      SSH_OPTS: -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes

    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Validate SSH connectivity
        run: |
          ssh -v ${{ env.SSH_OPTS }} -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo SSH connectivity OK"

      - name: Ensure release directory exists
        run: |
          ssh ${{ env.SSH_OPTS }} -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p '${{ env.DEPLOY_PATH }}'"

      - name: Promote staging jar to production
        run: |
          ssh ${{ env.SSH_OPTS }} -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "test -f '${{ env.STAGING_PATH }}/bugspointer.jar' && \
             test -f '${{ env.STAGING_PATH }}/bugspointer.commit_sha' && \
             test -f '${{ env.STAGING_PATH }}/bugspointer.jar.sha256' && \
             cp '${{ env.STAGING_PATH }}/bugspointer.jar' '${{ env.DEPLOY_PATH }}/bugspointer.jar' && \
             cmp -s '${{ env.STAGING_PATH }}/bugspointer.jar' '${{ env.DEPLOY_PATH }}/bugspointer.jar' && \
             cp '${{ env.STAGING_PATH }}/bugspointer.commit_sha' '${{ env.DEPLOY_PATH }}/bugspointer.commit_sha' && \
             cp '${{ env.STAGING_PATH }}/bugspointer.jar.sha256' '${{ env.DEPLOY_PATH }}/bugspointer.jar.sha256' && \
             printf 'Promoted staging jar to production\n' && \
             if [ -f '${{ env.DEPLOY_PATH }}/bugspointer.commit_sha' ]; then printf 'Commit: '; cat '${{ env.DEPLOY_PATH }}/bugspointer.commit_sha'; fi && \
             if [ -f '${{ env.DEPLOY_PATH }}/bugspointer.jar.sha256' ]; then printf 'SHA256: '; cat '${{ env.DEPLOY_PATH }}/bugspointer.jar.sha256'; fi"

      - name: Restart production service
        run: |
          ssh ${{ env.SSH_OPTS }} -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo -n /usr/bin/systemctl restart '${{ env.SERVICE_NAME }}' && /usr/bin/systemctl --no-pager --full status '${{ env.SERVICE_NAME }}'"
