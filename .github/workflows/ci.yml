name: CI

env:
  BUGSPOINTER_TEST_JWT_SECRET: ci-test-jwt-secret
  BUGSPOINTER_TEST_SMTP_HOST: smtp.example.invalid
  BUGSPOINTER_TEST_SMTP_PORT: 587
  BUGSPOINTER_TEST_SMTP_USER: ci@example.invalid
  BUGSPOINTER_TEST_SMTP_PASSWORD: ci-test-mail-password
  BUGSPOINTER_TEST_MOLLIE_API_KEY: test_mollie_placeholder

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Run tests
        run: ./mvnw test

      - name: Package jar
        run: ./mvnw -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: bugspointer-jar
          path: target/bugspointer-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
