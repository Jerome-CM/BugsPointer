#Profile Spring
spring.profiles.active=test
server.port=8080

################### DataSource Configuration ##########################
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.datasource.url=jdbc:h2:mem:bugspointertest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

################### Hibernate Configuration ##########################
spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=update
spring.main.allow-circular-references=true
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

################### Hibernate Configuration ##########################

jwt.secret=${BUGSPOINTER_TEST_JWT_SECRET:test-only-jwt-secret}

################### Mail Configuration ##########################

mail.smtp=${BUGSPOINTER_TEST_SMTP_HOST:smtp.example.invalid}
mail.port=${BUGSPOINTER_TEST_SMTP_PORT:587}
mail.user=${BUGSPOINTER_TEST_SMTP_USER:test@example.invalid}
mail.password=${BUGSPOINTER_TEST_SMTP_PASSWORD:test-only-mail-password}

################### Payment Provider Configuration ##########################

mollie.key=${BUGSPOINTER_TEST_MOLLIE_API_KEY:test_mollie_placeholder}
