<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" class="black">
<div th:replace="~{include/head.html}"></div>
    <title>Mandat SEPA - BugsPointer</title>
    <meta name="robots" content="noindex">
    <script th:src="@{/js/tailwindcss-cdn.js}"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { pointer: { green: '#00E676', lime: '#B7FF4A', ink: '#08110D' } }, fontFamily: { sans: ['Inter', 'DM-Sans', 'system-ui', 'sans-serif'], display: ['RalewayBold', 'Inter', 'system-ui', 'sans-serif'] } } } };
    </script>
    <link th:href="@{/css/home.css}" rel="stylesheet" />
    <style>.bugspointer-logo{display:none;}</style>
</head>
<body class="index home-modern min-h-full bg-[#06100c] font-sans text-white">
    <div th:replace="~{include/notifAlert.html}"></div>
    <div th:replace="~{include/navCompany.html}"></div>

    <main>
        <section class="relative px-5 pb-16 sm:px-8 lg:px-12">
            <div class="home-noise"></div>
            <div class="relative z-10 mx-auto grid max-w-[88rem] gap-6 lg:grid-cols-[0.38fr_0.62fr] lg:items-stretch">
                <aside class="flex h-full flex-col rounded-lg border border-pointer-green/25 bg-white/[0.075] p-6 shadow-[0_30px_100px_rgba(0,230,118,0.10)] backdrop-blur">
                    <p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Paiement sécurisé</p>
                    <h1 class="mt-3 font-display text-4xl leading-none text-white">Mandat SEPA</h1>
                    <p class="mt-4 text-sm leading-6 text-white/68">Vos coordonnées bancaires sont transmises au prestataire de paiement. Elles ne sont pas stockées sur nos serveurs.</p>
                    <div class="mt-6 grid grid-cols-3 gap-2 text-center text-xs font-black uppercase tracking-wider lg:mt-auto">
                        <span class="rounded-lg border border-pointer-green/25 bg-pointer-green/10 px-2 py-3 text-pointer-lime">Plan</span>
                        <span class="rounded-lg border border-pointer-green/25 bg-pointer-green/10 px-2 py-3 text-pointer-lime">Coordonnées</span>
                        <span class="rounded-lg border border-pointer-green/25 bg-pointer-green/10 px-2 py-3 text-pointer-lime">Paiement</span>
                    </div>
                </aside>

                <section class="flex h-full flex-col rounded-lg border border-white/10 bg-white/[0.055] p-5 shadow-[0_24px_80px_rgba(0,0,0,0.22)] backdrop-blur sm:p-6">
                    <div class="mb-6 border-b border-white/10 pb-5">
                        <p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Coordonnées bancaires</p>
                        <h2 class="mt-2 font-display text-3xl leading-none text-white">IBAN et BIC</h2>
                    </div>

                    <form class="flex flex-1 flex-col" action="#" th:action="@{/api/user/newMandate}" th:object="${customer}" method="post">
                        <div class="form-errors" th:if="${#fields.hasAnyErrors()}">
                            <p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p>
                        </div>

                        <div class="grid gap-4 md:grid-cols-2">
                            <input class="min-h-12 rounded-lg border border-white/10 bg-black/25 px-4 py-3 text-white outline-none placeholder:text-white/38 focus:border-pointer-green md:col-span-2" type="text" th:field="*{iban}" placeholder="IBAN : FR76 1254 8029 9898 7654 3210 917" th:value="${customer.getIban()}" required>
                            <input class="min-h-12 rounded-lg border border-white/10 bg-black/25 px-4 py-3 text-white outline-none placeholder:text-white/38 focus:border-pointer-green" type="text" th:field="*{bic}" placeholder="BIC : CCOPFRPP" th:value="${customer.getBic()}" required>
                            <div class="rounded-lg border border-pointer-green/25 bg-pointer-green/10 p-4">
                                <span class="text-xs font-black uppercase tracking-wider text-pointer-lime">Montant annuel</span>
                                <p class="mt-2 font-display text-3xl leading-none text-white"><span th:text="*{plan.getValeur()}">15.00</span>€</p>
                            </div>
                        </div>

                        <input type="hidden" th:field="*{publicKey}" th:value="${customer.publicKey}" readonly>
                        <input type="hidden" th:field="*{plan}" th:value="${customer.plan}" readonly>
                        <input type="hidden" th:field="*{mail}" th:value="${customer.mail}" readonly>

                        <label class="mt-5 flex gap-3 rounded-lg border border-white/10 bg-black/15 p-4 text-sm leading-6 text-white/70">
                            <input class="mt-1 h-4 w-4 accent-[#00E676]" type="checkbox" th:field="*{signature}" required>
                            <span>Je signe le mandat SEPA et j'autorise BugsPointer à prélever <strong class="text-white"><span th:text="*{plan.getValeur()}"></span>€ par an</strong>.</span>
                        </label>

                        <div class="mt-5 flex justify-end">
                            <button class="min-h-12 w-full cursor-pointer rounded-lg bg-pointer-green px-5 py-3 font-extrabold text-pointer-ink shadow-[0_18px_45px_rgba(0,230,118,0.18)] transition hover:-translate-y-0.5 hover:bg-pointer-lime md:w-auto" type="submit">Souscrire</button>
                        </div>
                    </form>
                </section>
            </div>
        </section>
    </main>

    <div th:replace="~{include/footer.html}"></div>
</body>
</html>
