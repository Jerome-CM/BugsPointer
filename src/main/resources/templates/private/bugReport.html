<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" class="black">
<div th:replace="~{include/head.html}"></div>
    <link rel="stylesheet" th:href="@{/css/prism.css}">
    <script th:src="@{/js/prism.js}"></script>
    <title th:text="${title}"></title>
    <meta name="robots" content="noindex">
    <script th:src="@{/js/tailwindcss-cdn.js}"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pointer: {
                            green: '#00E676',
                            lime: '#B7FF4A',
                            ink: '#08110D'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'DM-Sans', 'system-ui', 'sans-serif'],
                        display: ['RalewayBold', 'Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <link th:href="@{/css/home.css}" rel="stylesheet" />
    <style>
        .bugspointer-logo{display:none;}
        pre.bug-code{margin:0;white-space:pre;tab-size:2;}
        pre.bug-code code{display:block;white-space:pre;overflow:auto;}
    </style>
</head>
<body class="index home-modern min-h-full bg-[#06100c] font-sans text-white">

<div th:replace="~{include/navCompany.html}"></div>


<main class="relative px-5 pb-16 pt-6 sm:px-8 lg:px-12">
    <div class="home-noise"></div>
    <div class="relative z-10 mx-auto grid max-w-[88rem] gap-5 xl:grid-cols-[260px_1fr] xl:items-start">
        <div th:replace="~{include/asideReport.html}"></div>

        <section class="grid gap-5">
            <header class="rounded-lg border border-white/10 bg-white/[0.065] p-5 shadow-[0_28px_90px_rgba(0,0,0,0.28)] backdrop-blur sm:p-6 lg:p-8">
                <p class="mb-4 inline-flex rounded-full border border-white/10 bg-white/10 px-4 py-2 text-sm font-semibold text-pointer-lime">
                    Rapport de bug
                </p>
                <h1 class="font-display text-4xl leading-none text-white sm:text-5xl" th:text="${title}">Bug report</h1>
                <a class="mt-5 block break-all rounded-lg border border-pointer-green/20 bg-pointer-green/10 px-4 py-3 font-bold text-pointer-lime transition hover:text-pointer-green"
                   th:href="${bug.getUrl()}" target="_blank" rel="noopener" th:text="${bug.getUrl()}">https://example.com</a>
            </header>

            <div class="grid gap-5 xl:grid-cols-[1fr_340px] xl:items-start">
                <section class="grid gap-5">
                    <article class="rounded-lg border border-white/10 bg-white/[0.055] p-5 shadow-[0_24px_80px_rgba(0,0,0,0.22)] backdrop-blur sm:p-6">
                        <p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Description</p>
                        <p class="mt-4 leading-7 text-white/72" th:text="${bug.getDescription() != null ? bug.getDescription() : ''}"></p>
                    </article>

                    <article class="rounded-lg border border-white/10 bg-white/[0.055] p-5 shadow-[0_24px_80px_rgba(0,0,0,0.22)] backdrop-blur sm:p-6">
                        <div class="mb-5 border-b border-white/10 pb-5">
                            <p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Code sélectionné</p>
                            <p class="mt-2 text-sm leading-6 text-white/62">Cherchez <strong class="text-white">bugspointer-pointed-balise</strong> pour retrouver précisément l'élément pointé.</p>
                        </div>
                        <pre class="bug-code rounded-lg border border-white/10 bg-black/45 p-4 text-sm leading-6 text-white"><code class="language-markup" th:text="${code}"></code></pre>
                    </article>
                </section>

                <aside class="grid gap-5">
                    <article class="rounded-lg border border-white/10 bg-white/[0.055] p-5 shadow-[0_24px_80px_rgba(0,0,0,0.22)] backdrop-blur sm:p-6">
                        <p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Chronologie</p>
                        <dl class="mt-5 grid gap-3 text-sm">
                            <div class="rounded-lg border border-white/10 bg-black/15 p-3">
                                <dt class="font-black text-white">Signalé</dt>
                                <dd class="mt-1 text-white/64" th:text="${bug.getDateCreation() != null ? #dates.format(bug.getDateCreation(), 'dd/MM/yyyy - HH:mm:ss') : '- -'}"></dd>
                            </div>
                            <div class="rounded-lg border border-white/10 bg-black/15 p-3">
                                <dt class="font-black text-white">Vu</dt>
                                <dd class="mt-1 text-white/64" th:text="${bug.getDateView() != null ? #dates.format(bug.getDateView(), 'dd/MM/yyyy - HH:mm:ss') : '- -'}"></dd>
                            </div>
                            <div class="rounded-lg border border-white/10 bg-black/15 p-3">
                                <dt class="font-black text-white">Résolu / Ignoré</dt>
                                <dd class="mt-1 text-white/64" th:text="${bug.getDateSolved() != null ? #dates.format(bug.getDateSolved(), 'dd/MM/yyyy - HH:mm:ss') : '- -'}"></dd>
                            </div>
                        </dl>
                    </article>

                    <article class="rounded-lg border border-white/10 bg-white/[0.055] p-5 shadow-[0_24px_80px_rgba(0,0,0,0.22)] backdrop-blur sm:p-6">
                        <p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Environnement</p>
                        <dl class="mt-5 grid gap-3 text-sm">
                            <div class="rounded-lg border border-white/10 bg-black/15 p-3">
                                <dt class="font-black text-white">OS</dt>
                                <dd class="mt-1 text-white/64" th:text="${bug.getOs() != null ? bug.getOs() : '- -'}"></dd>
                            </div>
                            <div class="rounded-lg border border-white/10 bg-black/15 p-3">
                                <dt class="font-black text-white">Navigateur</dt>
                                <dd class="mt-1 text-white/64" th:text="${bug.getBrowser() != null ? bug.getBrowser() : '- -'}"></dd>
                            </div>
                            <div class="rounded-lg border border-white/10 bg-black/15 p-3">
                                <dt class="font-black text-white">Écran</dt>
                                <dd class="mt-1 text-white/64" th:text="${bug.getScreenSize() != null ? bug.getScreenSize() : '- -'}"></dd>
                            </div>
                        </dl>
                    </article>

                    <article class="grid gap-3 rounded-lg border border-white/10 bg-white/[0.055] p-5 shadow-[0_24px_80px_rgba(0,0,0,0.22)] backdrop-blur sm:p-6">
                        <a th:href="@{/app/private/dashboard}" class="inline-flex min-h-11 items-center justify-center rounded-lg border border-white/20 bg-white/5 px-4 py-2 font-extrabold text-white transition hover:border-pointer-green/40 hover:text-pointer-lime">Retour</a>
                        <form th:if="${bug.getEtatBug().name() != 'IGNORED' && bug.getEtatBug().name() != 'SOLVED'}" th:action="@{/app/private/confirmBug/{id}(id=${bug.getId()})}" method="post">
                            <button type="submit" class="min-h-11 w-full rounded-lg bg-pointer-green px-4 py-2 font-extrabold text-pointer-ink" th:text="${bug.getEtatBug().name == 'PENDING' ? 'Résoudre' : 'Confirmer'}">Confirmer</button>
                        </form>
                        <form th:if="${bug.getEtatBug().name() == 'SOLVED' || bug.getEtatBug().name() == 'IGNORED'}" th:action="@{/app/private/confirmBug/{id}(id=${bug.getId()})}" method="post">
                            <button type="submit" class="min-h-11 w-full rounded-lg bg-pointer-green px-4 py-2 font-extrabold text-pointer-ink">Réouvrir</button>
                        </form>
                        <form th:if="${bug.getEtatBug().name() != 'IGNORED' && bug.getEtatBug().name() != 'SOLVED'}" th:action="@{/app/private/ignoredBug/{id}(id=${bug.getId()})}" method="post">
                            <button type="submit" class="min-h-11 w-full rounded-lg border border-red-300/30 bg-red-500/15 px-4 py-2 font-extrabold text-red-100">Ignorer</button>
                        </form>
                    </article>
                </aside>
            </div>
        </section>
    </div>
</main>
<div th:replace="~{include/footer.html}"></div>
</body>
</html>
