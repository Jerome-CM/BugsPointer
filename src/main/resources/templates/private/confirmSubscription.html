<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" class="black">
<div th:replace="~{include/head.html}"></div>
    <title>Confirmation d'abonnement - BugsPointer</title>
    <meta name="robots" content="noindex">
    <script th:src="@{/js/tailwindcss-cdn.js}"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { pointer: { green: '#00E676', lime: '#B7FF4A', ink: '#08110D' } }, fontFamily: { sans: ['Inter', 'DM-Sans', 'system-ui', 'sans-serif'], display: ['RalewayBold', 'Inter', 'system-ui', 'sans-serif'] } } } };
    </script>
    <link th:href="@{/css/home.css}" rel="stylesheet" />
    <style>.bugspointer-logo{display:none;}</style>
</head>
<body class="index home-modern min-h-full bg-[#06100c] font-sans text-white">
    <div th:replace="~{include/notifAlert.html}"></div>
    <div th:replace="~{include/navCompany.html}"></div>

    <main>
        <section class="relative px-5 pb-16 pt-8 sm:px-8 lg:px-12">
            <div class="home-noise"></div>
            <div class="relative z-10 mx-auto max-w-4xl">
                <section class="rounded-lg border border-pointer-green/25 bg-white/[0.075] p-5 shadow-[0_30px_100px_rgba(0,230,118,0.10)] backdrop-blur sm:p-6">
                    <div class="mb-6 border-b border-white/10 pb-5">
                        <p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Confirmation</p>
                        <h1 class="mt-2 font-display text-4xl leading-none text-white">Changer de plan</h1>
                    </div>

                    <form action="#" th:action="@{/api/user/subscription}" method="post" th:object="${subscription}">
                        <div class="form-errors" th:if="${#fields.hasAnyErrors()}">
                            <p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p>
                        </div>

                        <div class="grid gap-4 md:grid-cols-2">
                            <div class="rounded-lg border border-white/10 bg-black/15 p-5" th:if="${subscription.getAmount() != null}">
                                <p class="text-xs font-black uppercase tracking-wider text-white/55">Plan actuel</p>
                                <h2 class="mt-2 font-display text-3xl leading-none text-white" th:text="${produit.toString()}">TARGET</h2>
                                <p class="mt-3 text-sm leading-6 text-white/68"><span th:text="${subscription.getAmount().getValue()}"></span>€ par an</p>
                                <p class="mt-1 text-sm leading-6 text-white/55">Valable jusqu'au <span th:text="${#dates.format(nextPaymentDate, 'dd/MM/yyyy')}"></span></p>
                            </div>

                            <div class="rounded-lg border border-pointer-green/25 bg-pointer-green/10 p-5" th:if="${subscription.getNewPlan() != null}">
                                <p class="text-xs font-black uppercase tracking-wider text-pointer-lime">Nouveau plan</p>
                                <h2 class="mt-2 font-display text-3xl leading-none text-white" th:text="${subscription.getNewPlan().name()}">TARGET</h2>
                                <p class="mt-3 text-sm leading-6 text-white/68"><span th:text="${subscription.getNewPlan().getValeur()}"></span>€ par an</p>
                            </div>
                        </div>

                        <input type="hidden" th:field="*{id}" th:value="${subscription.getId()}" readonly>
                        <input type="hidden" th:field="*{mandateId}" th:value="${subscription.getMandateId()}" readonly>
                        <input type="hidden" th:field="*{status}" th:value="${subscription.getStatus()}" readonly>
                        <input type="hidden" th:field="*{newPlan}" th:value="${subscription.getNewPlan()}" readonly>
                        <input type="hidden" th:field="*{publicKey}" th:value="${subscription.getPublicKey()}" readonly>

                        <div class="mt-6 flex flex-col gap-3 sm:flex-row">
                            <button class="min-h-12 w-full cursor-pointer rounded-lg bg-pointer-green px-5 py-3 font-extrabold text-pointer-ink shadow-[0_18px_45px_rgba(0,230,118,0.18)] transition hover:-translate-y-0.5 hover:bg-pointer-lime sm:w-auto" type="submit" name="action" value="submit">Confirmer le changement</button>
                            <button class="min-h-12 w-full cursor-pointer rounded-lg border border-red-300/30 bg-red-500/12 px-5 py-3 font-extrabold text-red-100 transition hover:border-red-200/60 sm:w-auto" type="submit" name="action" value="annuler">Annuler</button>
                        </div>
                    </form>
                </section>
            </div>
        </section>
    </main>

    <div th:replace="~{include/footer.html}"></div>
</body>
</html>
