<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" class="black">
<div th:replace="~{include/head.html}"></div>
    <title>Companies List</title>
    <meta name="robots" content="noindex">
    <script th:src="@{/js/tailwindcss-cdn.js}"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { pointer: { green: '#00E676', lime: '#B7FF4A', ink: '#08110D' } }, fontFamily: { sans: ['Inter', 'DM-Sans', 'system-ui', 'sans-serif'], display: ['RalewayBold', 'Inter', 'system-ui', 'sans-serif'] } } } };
    </script>
    <link th:href="@{/css/home.css}" rel="stylesheet" />
    <style>.bugspointer-logo{display:none;}</style>
</head>
<body class="index home-modern min-h-full bg-[#06100c] font-sans text-white">
    <div th:replace="~{include/notifAlert.html}"></div>
    <div th:replace="~{include/navAdmin.html}"></div>

    <main>
        <section class="relative px-5 pb-16 pt-12 sm:px-8 lg:px-12">
            <div class="home-noise"></div>
            <div class="relative z-10 mx-auto flex max-w-[88rem] flex-col gap-7">
                <section class="rounded-lg border border-white/10 bg-white/[0.055] p-5 shadow-[0_24px_80px_rgba(0,0,0,0.22)] backdrop-blur sm:p-6">
                    <div class="overflow-x-auto">
                        <table class="w-full min-w-[980px] border-separate border-spacing-0 overflow-hidden rounded-lg border border-white/10 text-center">
                            <thead>
                                <tr class="bg-black/25 text-sm uppercase tracking-wider text-white/58">
                                    <th class="px-4 py-3">Company</th>
                                    <th class="px-4 py-3">Creation</th>
                                    <th class="px-4 py-3">Status</th>
                                    <th class="px-4 py-3">Site vérifié</th>
                                    <th class="px-4 py-3">Received</th>
                                    <th class="px-4 py-3">Solved</th>
                                    <th class="px-4 py-3">Plan</th>
                                    <th class="px-4 py-3 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="group text-sm text-white/72 transition hover:bg-pointer-green/12 hover:text-white hover:shadow-[inset_4px_0_0_#00E676]" th:each="company : ${companies}">
                                    <td class="border-t border-white/10 px-4 py-3">
                                        <div class="flex items-center justify-center gap-3">
                                            <span class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-white/15 bg-black/35 shadow-[0_0_18px_rgba(0,230,118,0.12)]" th:title="${company.getRegistrationProvider()}">
                                                <img th:if="${company.getRegistrationProvider() == 'FORM'}" th:src="@{/favicon.svg}" alt="BugsPointer" class="h-5 w-5">
                                                <svg th:if="${company.getRegistrationProvider() == 'GOOGLE'}" class="h-5 w-5" viewBox="0 0 24 24" aria-label="Google">
                                                    <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.29h6.47c-.28 1.5-1.13 2.77-2.4 3.62v3h3.89c2.27-2.09 3.53-5.17 3.53-8.64z"/>
                                                    <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.89-3c-1.08.72-2.46 1.15-4.06 1.15-3.13 0-5.78-2.11-6.73-4.96H1.25v3.09C3.23 21.3 7.3 24 12 24z"/>
                                                    <path fill="#FBBC05" d="M5.27 14.28A7.21 7.21 0 0 1 4.89 12c0-.79.14-1.56.38-2.28V6.63H1.25A12 12 0 0 0 0 12c0 1.94.46 3.78 1.25 5.37z"/>
                                                    <path fill="#EA4335" d="M12 4.76c1.76 0 3.34.61 4.58 1.8l3.45-3.45C17.95 1.17 15.23 0 12 0 7.3 0 3.23 2.7 1.25 6.63l4.02 3.09C6.22 6.87 8.87 4.76 12 4.76z"/>
                                                </svg>
                                                <svg th:if="${company.getRegistrationProvider() == 'GITHUB'}" class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="currentColor" aria-label="GitHub">
                                                    <path d="M12 .5A11.5 11.5 0 0 0 8.36 22.9c.58.1.79-.25.79-.56v-2.02c-3.22.7-3.9-1.38-3.9-1.38-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.04 1.76 2.72 1.25 3.38.96.1-.75.4-1.25.73-1.54-2.57-.29-5.27-1.28-5.27-5.72 0-1.26.45-2.3 1.19-3.11-.12-.29-.52-1.47.11-3.07 0 0 .97-.31 3.17 1.19A10.9 10.9 0 0 1 12 6.06c.98 0 1.96.13 2.88.39 2.2-1.5 3.17-1.19 3.17-1.19.63 1.6.23 2.78.11 3.07.74.81 1.19 1.85 1.19 3.11 0 4.45-2.7 5.43-5.28 5.72.42.36.79 1.07.79 2.16v3.02c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/>
                                                </svg>
                                            </span>
                                            <span class="font-bold text-white" th:text="${company.getCompanyName() != null && company.getCompanyName() != '' ? company.getCompanyName() : 'Nom à compléter'}">Company</span>
                                        </div>
                                    </td>
                                    <td class="border-t border-white/10 px-4 py-3" th:text="${company.getCreationDate}"></td>
                                    <td class="border-t border-white/10 px-4 py-3">
                                        <span th:if="${company.motifEnable.equals('Validate')}" class="rounded-full border border-pointer-green/25 bg-pointer-green/10 px-3 py-1 text-xs font-black uppercase tracking-wider text-pointer-lime" th:text="${company.motifEnable}"></span>
                                        <span th:if="${company.motifEnable.equals('Confirmation')}" class="rounded-full border border-yellow-300/25 bg-yellow-300/10 px-3 py-1 text-xs font-black uppercase tracking-wider text-yellow-100" th:text="${company.motifEnable}"></span>
                                        <span th:if="${company.motifEnable.equals('Suppression')}" class="rounded-full border border-red-300/25 bg-red-500/10 px-3 py-1 text-xs font-black uppercase tracking-wider text-red-100" th:text="${company.motifEnable}"></span>
                                        <span th:if="${company.motifEnable.equals('Admin')}" class="rounded-full border border-sky-300/25 bg-sky-400/10 px-3 py-1 text-xs font-black uppercase tracking-wider text-sky-100" th:text="${company.motifEnable}"></span>
                                    </td>
                                    <td class="border-t border-white/10 px-4 py-3">
                                        <span th:if="${company.isDomainVerified()}" class="rounded-full border border-pointer-green/25 bg-pointer-green/10 px-3 py-1 text-xs font-black uppercase tracking-wider text-pointer-lime">Oui</span>
                                        <span th:if="${!company.isDomainVerified()}" class="rounded-full border border-red-300/25 bg-red-500/10 px-3 py-1 text-xs font-black uppercase tracking-wider text-red-100">Non</span>
                                    </td>
                                    <td class="border-t border-white/10 px-4 py-3" th:text="${company.getNbrTotalBug()}"></td>
                                    <td class="border-t border-white/10 px-4 py-3" th:text="${company.getNbrSolved()}"></td>
                                    <td class="border-t border-white/10 px-4 py-3">
                                        <span th:if="${company.getPlan().equals('Target')}" class="rounded-full border border-yellow-200/55 bg-yellow-300/25 px-3 py-1 text-xs font-black uppercase tracking-wider text-yellow-50 shadow-[0_0_24px_rgba(253,224,71,0.18)]" th:text="${company.getPlan()}"></span>
                                        <span th:if="${!company.getPlan().equals('Target')}" class="rounded-full border border-pointer-green/25 bg-pointer-green/10 px-3 py-1 text-xs font-black uppercase tracking-wider text-pointer-lime" th:text="${company.getPlan()}"></span>
                                    </td>
                                    <td class="border-t border-white/10 px-4 py-3"><a class="font-bold text-pointer-lime transition hover:text-pointer-green" target="_blank" th:href="@{/app/admin/companyDetails/{id}(id=${company.getCompanyId()})}">Details</a></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </section>
    </main>
</body>
</html>
