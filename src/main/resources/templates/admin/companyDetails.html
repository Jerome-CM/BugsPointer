<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" class="black">
<div th:replace="~{include/head.html}"></div>
    <title>Company details</title>
    <meta name="robots" content="noindex">
    <script th:src="@{/js/tailwindcss-cdn.js}"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { pointer: { green: '#00E676', lime: '#B7FF4A', ink: '#08110D' } }, fontFamily: { sans: ['Inter', 'DM-Sans', 'system-ui', 'sans-serif'], display: ['RalewayBold', 'Inter', 'system-ui', 'sans-serif'] } } } };
    </script>
    <link th:href="@{/css/home.css}" rel="stylesheet" />
    <style>.bugspointer-logo{display:none;}</style>
</head>
<body class="index home-modern min-h-full bg-[#06100c] font-sans text-white">
    <div th:replace="~{include/notifAlert.html}"></div>
    <div th:replace="~{include/navAdmin.html}"></div>

    <main>
        <section class="relative px-5 pb-16 pt-12 sm:px-8 lg:px-12">
            <div class="home-noise"></div>
            <div class="relative z-10 mx-auto flex max-w-[88rem] flex-col gap-7">
                <div class="rounded-lg border border-white/10 bg-white/[0.065] p-6 shadow-[0_28px_90px_rgba(0,0,0,0.28)] backdrop-blur md:p-8">
                    <p class="mb-5 inline-flex rounded-full border border-white/10 bg-white/10 px-4 py-2 text-sm font-semibold text-pointer-lime">Company details</p>
                    <div class="flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
                        <div>
                            <h1 class="font-display text-4xl leading-[0.98] text-white sm:text-5xl lg:text-6xl" th:text="${company.getCompanyName()}">Company</h1>
                            <a class="mt-4 inline-flex text-sm font-bold text-pointer-lime transition hover:text-pointer-green" target="_blank" rel="noopener" th:href="${company.getDomaine() != null && !#strings.isEmpty(company.getDomaine()) ? (#strings.startsWith(company.getDomaine(), 'http') ? company.getDomaine() : 'https://' + company.getDomaine()) : '#'}" th:text="${company.getDomaine()}">domain</a>
                        </div>
                        <form class="w-full lg:w-auto" th:action="@{/app/admin/lockCompany/{id}(id=${company.getCompanyId()})}" method="post">
                            <button class="min-h-12 w-full rounded-lg border px-5 py-3 font-extrabold transition lg:w-auto" th:classappend="${company.isEnable()} ? ' border-red-300/30 bg-red-500/12 text-red-100 hover:border-red-200/60' : ' border-pointer-green/30 bg-pointer-green/10 text-pointer-lime hover:border-pointer-green/60'" type="submit" th:text="${company.isEnable()} ? 'Lock account' : 'Unlock account'">Lock</button>
                        </form>
                    </div>
                </div>

                <section class="grid gap-5 md:grid-cols-2 xl:grid-cols-4">
                    <div class="rounded-lg border border-red-400/25 bg-white/[0.065] p-5"><p class="text-sm font-black uppercase tracking-wider text-red-200">New</p><p class="mt-4 font-display text-5xl text-white" th:text="${company.getNbNewBug()}">0</p></div>
                    <div class="rounded-lg border border-yellow-300/25 bg-white/[0.065] p-5"><p class="text-sm font-black uppercase tracking-wider text-yellow-100">Pending</p><p class="mt-4 font-display text-5xl text-white" th:text="${company.getNbPendingBug()}">0</p></div>
                    <div class="rounded-lg border border-pointer-green/25 bg-white/[0.065] p-5"><p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Solved</p><p class="mt-4 font-display text-5xl text-white" th:text="${company.getNbSolvedBug()}">0</p></div>
                    <div class="rounded-lg border border-white/10 bg-white/[0.055] p-5"><p class="text-sm font-black uppercase tracking-wider text-white/55">Ignored</p><p class="mt-4 font-display text-5xl text-white" th:text="${company.getNbIgnoredBug()}">0</p></div>
                </section>

                <div class="grid gap-5 lg:grid-cols-[320px_1fr] lg:items-start">
                    <aside class="flex flex-col gap-5">
                        <section class="rounded-lg border border-white/10 bg-white/[0.055] p-5 shadow-[0_24px_80px_rgba(0,0,0,0.22)] backdrop-blur">
                            <p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Account</p>
                            <dl class="mt-5 grid gap-4 text-sm">
                                <div>
                                    <dt class="text-white/48">Status</dt>
                                    <dd class="mt-1">
                                        <span class="rounded-full border px-3 py-1 text-xs font-black uppercase tracking-wider"
                                              th:classappend="${company.getMotifEnable() != null && company.getMotifEnable() == 'VALIDATE'} ? ' border-pointer-green/35 bg-pointer-green/12 text-pointer-lime' : ' border-red-300/35 bg-red-500/12 text-red-100'"
                                              th:text="${company.getMotifEnable() != null && company.getMotifEnable() == 'VALIDATE'} ? 'Validé' : 'Non validé'">Validé</span>
                                    </dd>
                                </div>
                                <div><dt class="text-white/48">Date register</dt><dd class="mt-1 font-bold text-white" th:text="${T(com.bugspointer.utility.Utility).dateFormator(company.getDateCreation(), 'dd/MM/yyyy HH:mm')}"></dd></div>
                                <div><dt class="text-white/48">Last visit</dt><dd class="mt-1 font-bold text-white" th:text="${T(com.bugspointer.utility.Utility).dateFormator(company.getLastVisit(), 'dd/MM/yyyy HH:mm')}"></dd></div>
                                <div><dt class="text-white/48">Last report</dt><dd class="mt-1 font-bold text-white" th:text="${T(com.bugspointer.utility.Utility).dateFormator(company.getLastReport(), 'dd/MM/yyyy HH:mm')}"></dd></div>
                                <div>
                                    <dt class="text-white/48">Plan</dt>
                                    <dd class="mt-1">
                                        <span class="rounded-full border px-3 py-1 text-xs font-black uppercase tracking-wider"
                                              th:classappend="${company.getPlan() != null && company.getPlan().name() != 'FREE'} ? ' border-yellow-200/55 bg-yellow-300/25 text-yellow-50 shadow-[0_0_24px_rgba(253,224,71,0.18)]' : ' border-white/12 bg-white/8 text-white/72'"
                                              th:text="${company.getPlan()}">FREE</span>
                                    </dd>
                                </div>
                            </dl>
                        </section>

                        <section class="rounded-lg border border-white/10 bg-white/[0.055] p-5 shadow-[0_24px_80px_rgba(0,0,0,0.22)] backdrop-blur" th:if="${company.getCustomerId() != null}">
                            <p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Billing</p>
                            <dl class="mt-5 grid gap-4 text-sm">
                                <div><dt class="text-white/48">Customer ID</dt><dd class="mt-1 break-all font-bold text-white" th:text="${company.getCustomerId()}"></dd></div>
                                <div><dt class="text-white/48">Last mandate</dt><dd class="mt-1 font-bold text-white" th:text="${company.getDateLastMandate()}"></dd></div>
                            </dl>
                            <div class="mt-5 grid gap-3">
                                <div class="rounded-lg border border-white/10 bg-black/15 p-3" th:each="mandate : ${company.getMandatesList()}">
                                    <span class="rounded-full border border-pointer-green/25 bg-pointer-green/10 px-2 py-1 text-xs font-black text-pointer-lime" th:text="${mandate.getStatus()}"></span>
                                    <p class="mt-3 break-all text-sm font-bold text-white" th:text="${mandate.getMandateId()}"></p>
                                    <p class="mt-1 text-xs text-white/55" th:text="${mandate.getSignatureDate()}"></p>
                                </div>
                            </div>
                        </section>
                    </aside>

                    <section class="rounded-lg border border-white/10 bg-white/[0.055] p-5 shadow-[0_24px_80px_rgba(0,0,0,0.22)] backdrop-blur sm:p-6">
                        <div class="mb-5 border-b border-white/10 pb-5">
                            <p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Logs</p>
                            <h2 class="mt-2 font-display text-3xl leading-none text-white">Historique</h2>
                        </div>
                        <div class="grid gap-3">
                            <div class="grid gap-2 rounded-lg border border-white/10 bg-black/15 p-4 md:grid-cols-[160px_1fr]" th:each="log : ${logs}">
                                <span class="text-sm font-bold text-pointer-lime" th:text="${log.getDate()}"></span>
                                <span class="text-sm leading-6 text-white/70" th:text="${log.getLog()}"></span>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
