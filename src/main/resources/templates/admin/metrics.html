<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" class="black">
<div th:replace="~{include/head.html}"></div>
    <title>Metrics</title>
    <meta name="robots" content="noindex">
    <script th:src="@{/js/tailwindcss-cdn.js}"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { pointer: { green: '#00E676', lime: '#B7FF4A', ink: '#08110D' } }, fontFamily: { sans: ['Inter', 'DM-Sans', 'system-ui', 'sans-serif'], display: ['RalewayBold', 'Inter', 'system-ui', 'sans-serif'] } } } };
    </script>
    <link th:href="@{/css/home.css}" rel="stylesheet" />
    <style>.bugspointer-logo{display:none;}</style>
</head>
<body class="index home-modern min-h-full bg-[#06100c] font-sans text-white">
    <div th:replace="~{include/notifAlert.html}"></div>
    <div th:replace="~{include/navAdmin.html}"></div>

    <main>
        <section class="relative px-5 pb-16 pt-12 sm:px-8 lg:px-12">
            <div class="home-noise"></div>
            <div class="relative z-10 mx-auto flex max-w-[88rem] flex-col gap-7">
                <div class="rounded-lg border border-white/10 bg-white/[0.065] p-6 shadow-[0_28px_90px_rgba(0,0,0,0.28)] backdrop-blur md:p-8">
                    <p class="mb-5 inline-flex rounded-full border border-white/10 bg-white/10 px-4 py-2 text-sm font-semibold text-pointer-lime">Metrics</p>
                    <h1 class="font-display text-4xl leading-[0.98] text-white sm:text-5xl lg:text-6xl">Trafic et comptes.</h1>
                </div>

                <div class="flex flex-wrap items-center gap-2 rounded-lg border border-white/10 bg-white/[0.055] p-4">
                    <span class="mr-2 text-sm font-black uppercase tracking-wider text-pointer-lime">Période</span>
                    <a th:href="@{?dayOpt=7}" class="rounded-lg border border-white/10 bg-black/15 px-3 py-2 text-sm font-bold text-white/70 hover:text-pointer-lime">7j</a>
                    <a th:href="@{?dayOpt=15}" class="rounded-lg border border-white/10 bg-black/15 px-3 py-2 text-sm font-bold text-white/70 hover:text-pointer-lime">15j</a>
                    <a th:href="@{?dayOpt=30}" class="rounded-lg border border-white/10 bg-black/15 px-3 py-2 text-sm font-bold text-white/70 hover:text-pointer-lime">1 mois</a>
                    <a th:href="@{?dayOpt=90}" class="rounded-lg border border-white/10 bg-black/15 px-3 py-2 text-sm font-bold text-white/70 hover:text-pointer-lime">3 mois</a>
                    <a th:href="@{?dayOpt=180}" class="rounded-lg border border-white/10 bg-black/15 px-3 py-2 text-sm font-bold text-white/70 hover:text-pointer-lime">6 mois</a>
                    <a th:href="@{?dayOpt=365}" class="rounded-lg border border-white/10 bg-black/15 px-3 py-2 text-sm font-bold text-white/70 hover:text-pointer-lime">1 an</a>
                </div>

                <section class="grid gap-5">
                    <div class="rounded-lg border border-white/10 bg-white/[0.055] p-5 shadow-[0_24px_80px_rgba(0,0,0,0.22)] backdrop-blur sm:p-6">
                        <h2 class="mb-5 font-display text-3xl leading-none text-white">Visits</h2>
                        <canvas id="visits" class="min-h-[320px]"></canvas>
                    </div>
                    <div class="rounded-lg border border-white/10 bg-white/[0.055] p-5 shadow-[0_24px_80px_rgba(0,0,0,0.22)] backdrop-blur sm:p-6">
                        <h2 class="mb-5 font-display text-3xl leading-none text-white">Users</h2>
                        <canvas id="newUser" class="min-h-[320px]"></canvas>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        const options = { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { precision: 0, color: 'rgba(255,255,255,.55)' }, grid: { color: 'rgba(255,255,255,.08)' } }, x: { ticks: { color: 'rgba(255,255,255,.55)' }, grid: { color: 'rgba(255,255,255,.05)' } } }, plugins: { legend: { labels: { color: 'rgba(255,255,255,.72)' } } } };
        const visits = document.getElementById('visits');
        const dataFromSpringForVisits = [[${nbrVisit}]];
        new Chart(visits, { type: 'line', data: { labels: dataFromSpringForVisits.labels, datasets: dataFromSpringForVisits.datasets.map((dataset, index) => ({ label: dataset.nameOfData, data: dataset.value, borderWidth: 3, fill: false, borderColor: ['#ffffff','#00E676','#B7FF4A','#38bdf8','#facc15','#f87171'][index] || '#00E676', tension: 0.3 })) }, options: options });
        const users = document.getElementById('newUser');
        const dataFromSpringForUser = [[${nbrUser}]];
        new Chart(users, { type: 'line', data: { labels: dataFromSpringForUser.labels, datasets: dataFromSpringForUser.datasets.map((dataset, index) => ({ label: dataset.nameOfData, data: dataset.value, borderWidth: 3, fill: false, borderColor: ['#B7FF4A','#00E676','#38bdf8'][index] || '#00E676', tension: 0.3 })) }, options: options });
    </script>
</body>
</html>
