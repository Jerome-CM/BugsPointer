<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" class="black">
<div th:replace="~{include/head.html}"></div>
    <title>Add billing - BugsPointer</title>
    <meta name="robots" content="noindex">
    <script th:src="@{/js/tailwindcss-cdn.js}"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { pointer: { green: '#00E676', lime: '#B7FF4A', ink: '#08110D' } }, fontFamily: { sans: ['Inter', 'DM-Sans', 'system-ui', 'sans-serif'], display: ['RalewayBold', 'Inter', 'system-ui', 'sans-serif'] } } } };
    </script>
    <link th:href="@{/css/home.css}" rel="stylesheet" />
    <style>.bugspointer-logo{display:none;}</style>
</head>
<body class="index home-modern min-h-full bg-[#06100c] font-sans text-white">
    <div th:replace="~{include/notifAlert.html}"></div>
    <div th:replace="~{include/navAdmin.html}"></div>

    <main>
        <section class="relative px-5 pb-16 pt-12 sm:px-8 lg:px-12">
            <div class="home-noise"></div>
            <div class="relative z-10 mx-auto flex max-w-[88rem] flex-col gap-7">
                <div class="rounded-lg border border-white/10 bg-white/[0.065] p-6 shadow-[0_28px_90px_rgba(0,0,0,0.28)] backdrop-blur md:p-8">
                    <p class="mb-5 inline-flex rounded-full border border-white/10 bg-white/10 px-4 py-2 text-sm font-semibold text-pointer-lime">Admin billing</p>
                    <h1 class="font-display text-4xl leading-[0.98] text-white sm:text-5xl lg:text-6xl">Ajouter une dépense.</h1>
                    <p class="mt-6 max-w-3xl text-base leading-7 text-white/70 sm:text-lg">Ajoutez les dépenses de publicité, outils ou opérations pour suivre la rentabilité estimée.</p>
                </div>

                <section class="grid gap-5 md:grid-cols-3">
                    <div class="rounded-lg border border-white/10 bg-white/[0.065] p-5"><p class="text-sm font-black uppercase tracking-wider text-white/55">Dépenses</p><p class="mt-3 font-display text-4xl text-white"><span th:text="${billingTotal}">0</span>€</p></div>
                    <div class="rounded-lg border border-pointer-green/25 bg-white/[0.075] p-5"><p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Revenu estimé</p><p class="mt-3 font-display text-4xl text-white"><span th:text="${estimatedRevenue}">0</span>€</p></div>
                    <div class="rounded-lg border border-pointer-green/25 bg-white/[0.075] p-5"><p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Rentabilité</p><p class="mt-3 font-display text-4xl text-white"><span th:text="${estimatedProfit}">0</span>€</p></div>
                </section>

                <div class="grid gap-5 lg:grid-cols-[420px_1fr] lg:items-start">
                    <form class="rounded-lg border border-pointer-green/25 bg-white/[0.075] p-5 shadow-[0_30px_100px_rgba(0,230,118,0.12)] backdrop-blur sm:p-6" action="#" th:action="@{/app/admin/addBilling}" th:object="${billing}" method="post">
                        <div class="form-errors" th:if="${#fields.hasAnyErrors()}"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div>
                        <div class="mb-5 border-b border-white/10 pb-5">
                            <p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Nouvelle dépense</p>
                            <h2 class="mt-2 font-display text-3xl leading-none text-white">Billing</h2>
                        </div>
                        <div class="grid gap-4">
                            <input class="min-h-12 rounded-lg border border-white/10 bg-black/25 px-4 py-3 text-white outline-none" type="text" th:field="*{label}" placeholder="Ex: Campagne Google Ads">
                            <input class="min-h-12 rounded-lg border border-white/10 bg-black/25 px-4 py-3 text-white outline-none" type="text" th:field="*{category}" placeholder="Catégorie: Pub, outil, hébergement...">
                            <input class="min-h-12 rounded-lg border border-white/10 bg-black/25 px-4 py-3 text-white outline-none" type="number" step="0.01" min="0" th:field="*{amount}" placeholder="Montant">
                            <input class="min-h-12 rounded-lg border border-white/10 bg-black/25 px-4 py-3 text-white outline-none" type="date" th:field="*{billingDate}">
                        </div>
                        <button class="mt-5 min-h-12 w-full cursor-pointer rounded-lg bg-pointer-green px-5 py-3 font-extrabold text-pointer-ink shadow-[0_18px_45px_rgba(0,230,118,0.18)]" type="submit">Ajouter</button>
                    </form>

                    <section class="rounded-lg border border-white/10 bg-white/[0.055] p-5 shadow-[0_24px_80px_rgba(0,0,0,0.22)] backdrop-blur sm:p-6">
                        <div class="mb-5 border-b border-white/10 pb-5">
                            <p class="text-sm font-black uppercase tracking-wider text-pointer-lime">Historique</p>
                            <h2 class="mt-2 font-display text-3xl leading-none text-white">Dépenses saisies</h2>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full min-w-[680px] border-separate border-spacing-0 overflow-hidden rounded-lg border border-white/10 text-left">
                                <thead><tr class="bg-black/25 text-sm uppercase tracking-wider text-white/58"><th class="px-4 py-3">Date</th><th class="px-4 py-3">Libellé</th><th class="px-4 py-3">Catégorie</th><th class="px-4 py-3 text-right">Montant</th></tr></thead>
                                <tbody>
                                    <tr class="text-sm text-white/72" th:each="item : ${billings}">
                                        <td class="border-t border-white/10 px-4 py-3" th:text="${item.billingDate}"></td>
                                        <td class="border-t border-white/10 px-4 py-3" th:text="${item.label}"></td>
                                        <td class="border-t border-white/10 px-4 py-3" th:text="${item.category}"></td>
                                        <td class="border-t border-white/10 px-4 py-3 text-right"><span th:text="${item.amount}"></span>€</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
