<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Visuel réseaux sociaux BugsPointer - Une page imparfaite faite pour tester</title>
  <desc id="desc">Visuel promotionnel pour la page de test BugsPointer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06100C"/>
      <stop offset="0.5" stop-color="#0A1410"/>
      <stop offset="1" stop-color="#111A15"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.055"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E676"/>
      <stop offset="1" stop-color="#B7FF4A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
      .display { font-family: Raleway, Inter, Arial, Helvetica, sans-serif; font-weight: 900; }
      .white { fill: #fff; }
      .muted { fill: rgba(255,255,255,0.66); }
      .greenText { fill: #00E676; }
      .lime { fill: #B7FF4A; }
      .ink { fill: #08110D; }
    </style>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#grid)"/>
  <circle cx="80" cy="70" r="260" fill="#00E676" opacity="0.13"/>
  <circle cx="1010" cy="100" r="245" fill="#B7FF4A" opacity="0.10"/>
  <circle cx="1060" cy="560" r="230" fill="#00E676" opacity="0.07"/>

  <g transform="translate(72 62)">
    <rect x="0" y="0" width="205" height="48" rx="24" fill="#FFFFFF" opacity="0.09"/>
    <circle cx="28" cy="24" r="10" fill="#00E676" filter="url(#glow)"/>
    <text x="50" y="31" class="sans white" font-size="20" font-weight="800">Bugspointer</text>
  </g>

  <g transform="translate(72 143)">
    <text x="0" y="0" class="sans lime" font-size="18" font-weight="900" letter-spacing="3">CAS À DÉTECTER</text>
    <text x="0" y="74" class="display white" font-size="62" letter-spacing="0">
      <tspan x="0">Une page imparfaite</tspan>
      <tspan x="0" dy="70">faite pour tester</tspan>
    </text>
    <text x="0" y="236" class="sans muted" font-size="25" font-weight="650">
      <tspan x="0">Image absente, faux message serveur,</tspan>
      <tspan x="0" dy="36">contenu approximatif: tout est prêt</tspan>
      <tspan x="0" dy="36">pour tester un vrai retour utilisateur.</tspan>
    </text>
    <g transform="translate(0 352)">
      <rect x="0" y="0" width="286" height="56" rx="10" fill="url(#green)"/>
      <text x="28" y="36" class="sans ink" font-size="18" font-weight="900">Repérez les irritants</text>
    </g>
  </g>

  <g transform="translate(632 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="506" height="392" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="20" y="20" width="466" height="48" rx="16" fill="#FFFFFF" opacity="0.09"/>
    <circle cx="47" cy="44" r="7" fill="#FF6B6B"/>
    <circle cx="70" cy="44" r="7" fill="#FFD166"/>
    <circle cx="93" cy="44" r="7" fill="#00E676"/>
    <rect x="128" y="35" width="198" height="16" rx="8" fill="#FFFFFF" opacity="0.22"/>
    <g transform="translate(38 104)">
      <text x="0" y="0" class="sans lime" font-size="15" font-weight="900" letter-spacing="2">TESTPAGE</text>
      <text x="0" y="48" class="display white" font-size="39">Erreurs volontaires</text>
      <rect x="0" y="78" width="420" height="190" rx="18" fill="#06100C" stroke="#FFFFFF" stroke-opacity="0.11"/>
      <rect x="24" y="102" width="170" height="18" rx="9" fill="#FFFFFF" opacity="0.20"/>
      <rect x="24" y="138" width="372" height="44" rx="12" fill="#FFFFFF" opacity="0.08"/>
      <rect x="24" y="196" width="168" height="44" rx="12" fill="#FFFFFF" opacity="0.08"/>
      <rect x="212" y="196" width="184" height="44" rx="12" fill="#FF6B6B" opacity="0.15"/>
      <path d="M326 128l52 38-52 38z" fill="#00E676" opacity="0.18"/>
      <circle cx="330" cy="182" r="40" fill="none" stroke="#00E676" stroke-width="4"/>
      <circle cx="330" cy="182" r="15" fill="#00E676" filter="url(#glow)"/>
    </g>
  </g>

  <g transform="translate(720 378)" filter="url(#shadow)">
    <rect x="0" y="0" width="352" height="150" rx="24" fill="#FFFFFF"/>
    <text x="28" y="44" class="display" font-size="28" fill="#25243F">Signaler un bug de test</text>
    <rect x="28" y="68" width="296" height="34" rx="9" fill="#F1F5F9"/>
    <text x="44" y="91" class="sans" font-size="14" font-weight="800" fill="#64748B">Image cassée + erreur 500</text>
    <rect x="28" y="116" width="296" height="14" rx="7" fill="#00E676" opacity="0.90"/>
  </g>

  <g transform="translate(1032 462)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="50" fill="#00E676"/>
    <text x="0" y="18" text-anchor="middle" class="display ink" font-size="58">!</text>
  </g>

  <text x="72" y="586" class="sans muted" font-size="18" font-weight="800">Page de démonstration • signalement visuel • rapport de test par e-mail</text>
</svg>