<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Contexte automatique BugsPointer</title>
  <desc id="desc">Visuel social minimaliste BugsPointer sur la feature de contexte automatique dans les rapports de bug.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E676"/>
      <stop offset="1" stop-color="#B7FF4A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#06100C" flood-opacity=".14"/>
    </filter>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif}
      .display{font-family:Raleway,Inter,Arial,Helvetica,sans-serif;font-weight:900}
      .ink{fill:#06100C}
      .muted{fill:#58665F}
      .green{fill:#00E676}
      .lime{fill:#8EEA2D}
    </style>
  </defs>
  <rect width="1200" height="627" fill="#F4FAF6"/>
  <circle cx="1120" cy="78" r="260" fill="#00E676" opacity=".12"/>
  <circle cx="88" cy="575" r="240" fill="#B7FF4A" opacity=".18"/>

  <g transform="translate(72 58)">
    <rect width="196" height="46" rx="23" fill="#06100C"/>
    <text x="24" y="30" class="sans" font-size="18" font-weight="850" fill="#FFFFFF">BugsPointer</text>
    <circle cx="166" cy="23" r="8" fill="#00E676"/>
  </g>

  <g transform="translate(72 166)">
    <text class="sans green" font-size="17" font-weight="900">FEATURE</text>
    <text y="78" class="display ink" font-size="70">Contexte</text>
    <text y="150" class="display ink" font-size="70">automatique</text>
    <text y="222" class="sans muted" font-size="25" font-weight="650">
      <tspan x="0">Chaque signalement arrive avec les infos</tspan>
      <tspan x="0" dy="36">qui aident vraiment à reproduire.</tspan>
    </text>
  </g>

  <g transform="translate(72 500)">
    <rect width="340" height="54" rx="16" fill="#06100C"/>
    <text x="26" y="35" class="sans" font-size="18" font-weight="900" fill="#FFFFFF">Moins d'allers-retours support</text>
  </g>

  <g transform="translate(590 90)" filter="url(#softShadow)">
    <rect width="520" height="438" rx="34" fill="#FFFFFF"/>
    <rect x="34" y="32" width="452" height="64" rx="20" fill="#F3F7F4"/>
    <circle cx="66" cy="64" r="9" fill="#00E676"/>
    <rect x="94" y="54" width="168" height="20" rx="10" fill="#DCE8E1"/>
    <rect x="350" y="48" width="98" height="32" rx="16" fill="url(#green)"/>

    <text x="42" y="150" class="sans green" font-size="15" font-weight="900">RAPPORT DE BUG</text>
    <text x="42" y="188" class="display ink" font-size="34">Le bouton panier</text>
    <text x="42" y="226" class="display ink" font-size="34">disparait sur mobile</text>

    <rect x="42" y="266" width="436" height="1" fill="#E5EEE9"/>

    <g transform="translate(42 296)">
      <rect width="200" height="54" rx="16" fill="#F4FAF6"/>
      <text x="18" y="24" class="sans muted" font-size="13" font-weight="850">URL</text>
      <text x="18" y="43" class="sans ink" font-size="16" font-weight="900">/checkout</text>
    </g>
    <g transform="translate(278 296)">
      <rect width="200" height="54" rx="16" fill="#F4FAF6"/>
      <text x="18" y="24" class="sans muted" font-size="13" font-weight="850">NAVIGATEUR</text>
      <text x="18" y="43" class="sans ink" font-size="16" font-weight="900">Safari 18</text>
    </g>
    <g transform="translate(42 366)">
      <rect width="200" height="54" rx="16" fill="#F4FAF6"/>
      <text x="18" y="24" class="sans muted" font-size="13" font-weight="850">APPAREIL</text>
      <text x="18" y="43" class="sans ink" font-size="16" font-weight="900">iPhone</text>
    </g>
    <g transform="translate(278 366)">
      <rect width="200" height="54" rx="16" fill="#E9FFF2"/>
      <text x="18" y="24" class="sans muted" font-size="13" font-weight="850">ZONE POINTEE</text>
      <text x="18" y="43" class="sans ink" font-size="16" font-weight="900">CTA panier</text>
    </g>
  </g>

  <text x="72" y="594" class="sans muted" font-size="17" font-weight="800">bugspointer.com</text>
</svg>
