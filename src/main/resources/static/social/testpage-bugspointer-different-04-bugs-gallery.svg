<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc"><title id="title">Des erreurs faites pour être vues</title><desc id="desc">Visuel réseaux sociaux pour la page de test BugsPointer.</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06100C"/><stop offset="0.55" stop-color="#0A1410"/><stop offset="1" stop-color="#101814"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E676"/><stop offset="1" stop-color="#B7FF4A"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.055"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000" flood-opacity="0.34"/></filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="15" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0H0V72" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/></pattern>
  <style>.sans{font-family:Inter,Arial,Helvetica,sans-serif}.display{font-family:Raleway,Inter,Arial,Helvetica,sans-serif;font-weight:900}.white{fill:#fff}.muted{fill:rgba(255,255,255,.66)}.lime{fill:#B7FF4A}.greenText{fill:#00E676}.ink{fill:#08110D}</style>
</defs><rect width="1200" height="627" fill="url(#bg)"/><rect width="1200" height="627" fill="url(#grid)"/><circle cx="80" cy="70" r="265" fill="#00E676" opacity=".13"/><circle cx="1020" cy="118" r="250" fill="#B7FF4A" opacity=".1"/><circle cx="1060" cy="560" r="230" fill="#00E676" opacity=".065"/><g transform="translate(72 58)"><rect width="205" height="48" rx="24" fill="#fff" opacity=".09"/><circle cx="28" cy="24" r="10" fill="#00E676" filter="url(#glow)"/><text x="50" y="31" class="sans white" font-size="20" font-weight="800">Bugspointer</text></g>
<g transform="translate(72 136)"><text class="sans lime" font-size="18" font-weight="900" letter-spacing="3">CAS DE TEST</text><text y="76" class="display white" font-size="62"><tspan x="0">Des erreurs</tspan><tspan x="0" dy="70">à repérer</tspan></text><text y="238" class="sans muted" font-size="25" font-weight="650"><tspan x="0">Image cassée, faux message serveur,</tspan><tspan x="0" dy="36">contenu approximatif: la page est</tspan><tspan x="0" dy="36">prévue pour tester le widget.</tspan></text></g>
      <g transform="translate(620 96)"><g filter="url(#shadow)"><rect width="500" height="410" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity=".14"/></g><g transform="translate(38 42)"><rect width="190" height="150" rx="18" fill="#FF6B6B" opacity=".16" stroke="#FF6B6B" stroke-opacity=".35"/><text x="26" y="58" class="display white" font-size="34">404</text><text x="26" y="96" class="sans white" font-size="17" font-weight="900">Image absente</text><rect x="230" y="0" width="190" height="150" rx="18" fill="#fff" opacity=".09" stroke="#fff" stroke-opacity=".12"/><text x="256" y="58" class="display white" font-size="34">500</text><text x="256" y="96" class="sans white" font-size="17" font-weight="900">Erreur serveur</text><rect y="176" width="190" height="150" rx="18" fill="#FFD166" opacity=".16" stroke="#FFD166" stroke-opacity=".35"/><text x="26" y="234" class="display white" font-size="34">Aa</text><text x="26" y="272" class="sans white" font-size="17" font-weight="900">Texte à corriger</text><rect x="230" y="176" width="190" height="150" rx="18" fill="#00E676" opacity=".16" stroke="#00E676" stroke-opacity=".35"/><circle cx="302" cy="240" r="34" fill="none" stroke="#00E676" stroke-width="4"/><circle cx="302" cy="240" r="12" fill="#00E676"/><text x="256" y="298" class="sans white" font-size="17" font-weight="900">Zone pointée</text></g></g><text x="72" y="586" class="sans muted" font-size="18" font-weight="800">Une page volontairement imparfaite pour tester de vrais retours utilisateurs</text></svg>
