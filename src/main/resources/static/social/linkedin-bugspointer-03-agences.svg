<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Visuel LinkedIn Bugspointer - Moins de flou. Plus d’action.</title>
  <desc id="desc">Visuel marketing pour presenter Bugspointer, un outil de remontee de bugs depuis un site web.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06100C"/>
      <stop offset="0.48" stop-color="#0A1410"/>
      <stop offset="1" stop-color="#121B16"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.055"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18241F"/>
      <stop offset="1" stop-color="#0B130F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#00E676" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
      .display { font-family: Raleway, Inter, Arial, Helvetica, sans-serif; font-weight: 900; }
      .smallcaps { font-size: 18px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; }
      .muted { fill: rgba(255,255,255,0.64); }
      .white { fill: #ffffff; }
      .green { fill: #00E676; }
      .lime { fill: #B7FF4A; }
      .ink { fill: #08110D; }
    </style>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#grid)" opacity="0.72"/>
  <circle cx="52" cy="30" r="280" fill="#00E676" opacity="0.13"/>
  <circle cx="1010" cy="125" r="240" fill="#B7FF4A" opacity="0.10"/>
  <circle cx="1110" cy="560" r="190" fill="#00E676" opacity="0.07"/>

  <g transform="translate(72 62)">
    <rect x="0" y="0" width="205" height="48" rx="24" fill="#FFFFFF" opacity="0.09"/>
    <circle cx="28" cy="24" r="10" fill="#00E676" filter="url(#greenGlow)"/>
    <text x="50" y="31" class="sans white" font-size="20" font-weight="800">Bugspointer</text>
  </g>

  <g transform="translate(72 150)">
    <text x="0" y="0" class="sans lime smallcaps">Pensé pour les équipes web</text>
    <text x="0" y="74" class="display white" font-size="64" letter-spacing="0">
      <tspan x="0">Moins de flou.</tspan>
      <tspan x="0" dy="72">Plus d’action.</tspan>
    </text>
    <text x="0" y="236" class="sans muted" font-size="25" font-weight="600">
      <tspan x="0">Centralisez les retours clients,</tspan>
      <tspan x="0" dy="36">qualifiez les bugs et gardez</tspan>
      <tspan x="0" dy="36">une trace claire de chaque état.</tspan>
    </text>

    <g transform="translate(0 342)">
      <rect x="0" y="0" width="184" height="54" rx="10" fill="#00E676"/>
      <text x="28" y="35" class="sans ink" font-size="18" font-weight="900">Centraliser</text>
      <rect x="202" y="0" width="254" height="54" rx="10" fill="#FFFFFF" opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="228" y="35" class="sans white" font-size="17" font-weight="800">Prioriser les corrections</text>
    </g>
  </g>

  <g transform="translate(637 96)" filter="url(#shadow)">
    <rect x="0" y="0" width="492" height="382" rx="26" fill="url(#screen)" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="20" y="20" width="452" height="46" rx="16" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="45" cy="43" r="7" fill="#FF6B6B"/>
    <circle cx="67" cy="43" r="7" fill="#FFD166"/>
    <circle cx="89" cy="43" r="7" fill="#00E676"/>
    <rect x="124" y="34" width="196" height="17" rx="8.5" fill="#FFFFFF" opacity="0.18"/>

    <g transform="translate(36 94)">
      <text x="0" y="0" class="sans lime smallcaps" font-size="14">Tableau de bord</text>
      <text x="0" y="45" class="display white" font-size="39">Suivi des corrections</text>
      <g transform="translate(0 76)">
        <rect x="0" y="0" width="420" height="72" rx="14" fill="#FFFFFF" opacity="0.08" stroke="#00E676" stroke-opacity="0.22"/>
        <circle cx="34" cy="36" r="12" fill="#FF6B6B"/>
        <text x="58" y="31" class="sans white" font-size="18" font-weight="900">Bouton cassé sur mobile</text>
        <text x="58" y="54" class="sans muted" font-size="14">/checkout - iPhone Safari</text>
        <rect x="309" y="22" width="82" height="28" rx="14" fill="#FF6B6B" opacity="0.20"/>
        <text x="329" y="41" class="sans white" font-size="12" font-weight="900">NEW</text>
      </g>
      <g transform="translate(0 164)">
        <rect x="0" y="0" width="420" height="72" rx="14" fill="#FFFFFF" opacity="0.07"/>
        <circle cx="34" cy="36" r="12" fill="#FFD166"/>
        <text x="58" y="31" class="sans white" font-size="18" font-weight="900">Image absente</text>
        <text x="58" y="54" class="sans muted" font-size="14">/blog/article - Chrome</text>
        <rect x="292" y="22" width="99" height="28" rx="14" fill="#FFD166" opacity="0.20"/>
        <text x="313" y="41" class="sans white" font-size="12" font-weight="900">PENDING</text>
      </g>
    </g>
  </g>

  <g transform="translate(731 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="342" height="188" rx="24" fill="#FFFFFF"/>
    <text x="28" y="46" class="display" font-size="31" fill="#25243F">Signaler un bug</text>
    <rect x="28" y="72" width="286" height="38" rx="9" fill="#F1F5F9"/>
    <text x="44" y="97" class="sans" font-size="14" font-weight="700" fill="#64748B">https://site-client.fr/page</text>
    <rect x="28" y="124" width="286" height="42" rx="10" fill="#00E676"/>
    <text x="118" y="151" class="sans ink" font-size="16" font-weight="900">Pointer le bug</text>
  </g>

  <g transform="translate(1045 461)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="#00E676"/>
    <text x="0" y="18" text-anchor="middle" class="display ink" font-size="56">!</text>
  </g>

  <g transform="translate(72 590)">
    <text x="0" y="0" class="sans muted" font-size="18" font-weight="700">bugspointer.com</text>
    <text x="184" y="0" class="sans" font-size="18" font-weight="800" fill="#00E676">•</text>
    <text x="210" y="0" class="sans muted" font-size="18" font-weight="700">Widget personnalisable</text>
    <text x="432" y="0" class="sans" font-size="18" font-weight="800" fill="#00E676">•</text>
    <text x="458" y="0" class="sans muted" font-size="18" font-weight="700">Rapports exploitables</text>
  </g>
</svg>
