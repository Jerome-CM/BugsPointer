<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc"><title id="title">Testez le widget sur une vraie page</title><desc id="desc">Visuel réseaux sociaux pour la page de test BugsPointer.</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06100C"/><stop offset="0.55" stop-color="#0A1410"/><stop offset="1" stop-color="#101814"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E676"/><stop offset="1" stop-color="#B7FF4A"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.055"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000" flood-opacity="0.34"/></filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="15" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0H0V72" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/></pattern>
  <style>.sans{font-family:Inter,Arial,Helvetica,sans-serif}.display{font-family:Raleway,Inter,Arial,Helvetica,sans-serif;font-weight:900}.white{fill:#fff}.muted{fill:rgba(255,255,255,.66)}.lime{fill:#B7FF4A}.greenText{fill:#00E676}.ink{fill:#08110D}</style>
</defs><rect width="1200" height="627" fill="url(#bg)"/><rect width="1200" height="627" fill="url(#grid)"/><circle cx="80" cy="70" r="265" fill="#00E676" opacity=".13"/><circle cx="1020" cy="118" r="250" fill="#B7FF4A" opacity=".1"/><circle cx="1060" cy="560" r="230" fill="#00E676" opacity=".065"/><g transform="translate(72 58)"><rect width="205" height="48" rx="24" fill="#fff" opacity=".09"/><circle cx="28" cy="24" r="10" fill="#00E676" filter="url(#glow)"/><text x="50" y="31" class="sans white" font-size="20" font-weight="800">Bugspointer</text></g>
      <g transform="translate(72 150)"><text class="sans lime" font-size="18" font-weight="900" letter-spacing="3">PAGE DE TEST</text><text y="76" class="display white" font-size="64"><tspan x="0">Testez le widget</tspan><tspan x="0" dy="72">sur une vraie page</tspan></text><text y="238" class="sans muted" font-size="25" font-weight="650"><tspan x="0">Une démo sans risque pour pointer</tspan><tspan x="0" dy="36">un bug, décrire le problème et</tspan><tspan x="0" dy="36">recevoir un rapport par e-mail.</tspan></text><rect y="352" width="292" height="56" rx="10" fill="url(#green)"/><text x="28" y="388" class="sans ink" font-size="18" font-weight="900">bugspointer.com/testPage</text></g>
      <g transform="translate(650 92)" filter="url(#shadow)"><rect width="455" height="410" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity=".14"/><g transform="translate(24 24)"><rect x="0" y="0" width="430" height="48" rx="16" fill="#fff" opacity=".09"/><circle cx="26" cy="24" r="7" fill="#FF6B6B"/><circle cx="49" cy="24" r="7" fill="#FFD166"/><circle cx="72" cy="24" r="7" fill="#00E676"/><rect x="112" y="16" width="180" height="16" rx="8" fill="#fff" opacity=".22"/></g><g transform="translate(48 114)"><rect width="360" height="216" rx="18" fill="#06100C" stroke="#fff" stroke-opacity=".10"/><rect x="26" y="30" width="150" height="18" rx="9" fill="#fff" opacity=".20"/><rect x="26" y="72" width="308" height="46" rx="13" fill="#fff" opacity=".08"/><rect x="26" y="136" width="128" height="44" rx="12" fill="#FF6B6B" opacity=".16"/><rect x="176" y="136" width="158" height="44" rx="12" fill="#00E676" opacity=".16"/><circle cx="272" cy="95" r="42" fill="none" stroke="#00E676" stroke-width="4"/><circle cx="272" cy="95" r="14" fill="#00E676" filter="url(#glow)"/></g><g transform="translate(82 314)"><rect width="306" height="114" rx="22" fill="#fff"/><text x="24" y="42" class="display" font-size="25" fill="#25243F">Signaler un bug</text><rect x="24" y="60" width="258" height="32" rx="9" fill="#F1F5F9"/><rect x="24" y="100" width="258" height="10" rx="5" fill="#00E676"/></g></g></svg>