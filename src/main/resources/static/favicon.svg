<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feFlood flood-color="#00E676" flood-opacity=".65"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="#06100c"/>
  <circle cx="32" cy="32" r="21" fill="#00E676" filter="url(#softGlow)"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#fff" stroke-width="4"/>
  <path d="M32 17v23" stroke="#06100c" stroke-width="7" stroke-linecap="round"/>
  <circle cx="32" cy="48" r="4" fill="#06100c"/>
</svg>
